---
freeipa:
  hostname: "ipa.example.com"
  domain: "example.com"
  realm: "EXAMPLE.COM"
  admin_password: "ChangeMe123!"
  directory_manager_password: "ChangeMe123!"
  container_name: "freeipa"
  data_dir: "/opt/freeipa/data"
  image: "quay.io/freeipa/freeipa-server:rocky-9"

# Ports exposed on the host
freeipa_ports:
  - "389:389"    # LDAP
  - "636:636"    # LDAPS
  - "80:80"      # HTTP (IPA web UI)
  - "443:443"    # HTTPS (IPA web UI)
  - "88:88"      # Kerberos
  - "464:464"    # kpasswd

# Linux capabilities required by the FreeIPA entrypoint:
#   SYS_RESOURCE — set RLIMIT_CORE and other process resource limits
#   NET_ADMIN    — configure loopback and network interfaces
freeipa_run_caps:
  - SYS_RESOURCE
  - NET_ADMIN

# FreeIPA requires IPv6 enabled on the loopback interface
freeipa_sysctls:
  - "net.ipv6.conf.all.disable_ipv6=0"

# How long to wait for initialization (seconds, ~5-10 min for first run)
freeipa_init_timeout: 900
