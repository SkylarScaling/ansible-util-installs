---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - freeipa.hostname is defined and freeipa.hostname != ""
      - freeipa.domain is defined and freeipa.domain != ""
      - freeipa.realm is defined and freeipa.realm != ""
      - freeipa.admin_password is defined
      - freeipa.directory_manager_password is defined
    fail_msg: "freeipa.hostname, domain, realm, admin_password, and directory_manager_password must all be defined"

# --------------------------------------------------------------------------
# Host preparation (all idempotent)
# --------------------------------------------------------------------------
- name: Set hostname on the host
  ansible.builtin.hostname:
    name: "{{ freeipa.hostname }}"

- name: Ensure hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ ansible_default_ipv4.address }}\\s+{{ freeipa.hostname }}"
    line: "{{ ansible_default_ipv4.address }}  {{ freeipa.hostname }}  {{ freeipa.hostname.split('.')[0] }}"
    state: present

- name: Ensure podman is installed
  ansible.builtin.dnf:
    name: podman
    state: present

- name: Create FreeIPA data directory
  ansible.builtin.file:
    path: "{{ freeipa.data_dir }}"
    state: directory
    mode: '0755'

- name: Pull FreeIPA image
  ansible.builtin.command: podman pull {{ freeipa.image }}
  changed_when: true
  register: _pull_result
  retries: 3
  delay: 10
  until: _pull_result.rc == 0

# --------------------------------------------------------------------------
# Determine current state
# --------------------------------------------------------------------------
- name: Check if FreeIPA container exists
  ansible.builtin.command: podman inspect {{ freeipa.container_name }}
  register: _container_inspect
  changed_when: false
  failed_when: false

- name: Set container state facts
  ansible.builtin.set_fact:
    _container_exists: "{{ _container_inspect.rc == 0 }}"
    _container_status: >-
      {{ (_container_inspect.stdout | from_json)[0].State.Status
         if _container_inspect.rc == 0 else 'missing' }}

- name: Start existing container if stopped
  ansible.builtin.command: podman start {{ freeipa.container_name }}
  when: _container_exists and _container_status != 'running'
  changed_when: true

# Check whether IPA finished initializing. CA cert is the last artifact
# written by ipa-server-install — its presence means init completed.
- name: Check if FreeIPA initialization completed (CA cert present)
  ansible.builtin.shell: >
    podman exec {{ freeipa.container_name }}
    test -f /etc/ipa/ca.crt
  register: _ipa_initialized
  changed_when: false
  failed_when: false
  when: _container_exists

# --------------------------------------------------------------------------
# Automatic recovery from incomplete initialization
# --------------------------------------------------------------------------
- name: Remove incomplete FreeIPA container
  ansible.builtin.command: podman rm -f {{ freeipa.container_name }}
  when:
    - _container_exists
    - _ipa_initialized is defined
    - _ipa_initialized.rc != 0
  changed_when: true

- name: Wipe partial FreeIPA data directory
  ansible.builtin.file:
    path: "{{ freeipa.data_dir }}"
    state: absent
  when:
    - _container_exists
    - _ipa_initialized is defined
    - _ipa_initialized.rc != 0

- name: Recreate FreeIPA data directory after wipe
  ansible.builtin.file:
    path: "{{ freeipa.data_dir }}"
    state: directory
    mode: '0755'
  when:
    - _container_exists
    - _ipa_initialized is defined
    - _ipa_initialized.rc != 0

- name: Set initialization flag
  ansible.builtin.set_fact:
    _needs_init: >-
      {{ not _container_exists or
         (_ipa_initialized is defined and _ipa_initialized.rc != 0) }}

# --------------------------------------------------------------------------
# Initialize (only when needed)
#
# DNS setup (--setup-dns) is intentionally omitted. On EC2, port 53 is
# held by the AWS resolver and the BIND install always fails. FreeIPA
# works fine as a pure LDAP/Kerberos server without DNS.
# --skip-conncheck suppresses connectivity pre-flight checks that
# fail in container/NAT environments.
# --------------------------------------------------------------------------
- name: Initialize FreeIPA server container (takes 5-10 minutes)
  ansible.builtin.command: >
    podman run -d
    --name {{ freeipa.container_name }}
    --hostname {{ freeipa.hostname }}
    {% for port in freeipa_ports %}-p {{ port }} {% endfor %}
    -v {{ freeipa.data_dir }}:/data:Z
    {{ freeipa.image }}
    ipa-server-install
    --unattended
    --hostname={{ freeipa.hostname }}
    --domain={{ freeipa.domain }}
    --realm={{ freeipa.realm }}
    --admin-password={{ freeipa.admin_password }}
    --ds-password={{ freeipa.directory_manager_password }}
    --no-ntp
    --skip-conncheck
  when: _needs_init
  changed_when: true
  no_log: true

# --------------------------------------------------------------------------
# Wait for full initialization.
# Each iteration checks the container status first. If the container
# exited (install failed), we capture the last 50 log lines and fail
# immediately rather than retrying for another 15 minutes.
# --------------------------------------------------------------------------
- name: Wait for FreeIPA to fully initialize
  ansible.builtin.shell: |
    STATUS=$(podman inspect {{ freeipa.container_name }} \
      --format '{{ "{{" }}.State.Status{{ "}}" }}' 2>/dev/null || echo "missing")
    if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$STATUS" = "missing" ]; then
      echo "Container exited during initialization (status: $STATUS)" >&2
      echo "=== Last 50 log lines ===" >&2
      podman logs --tail=50 {{ freeipa.container_name }} 2>&1 || true
      exit 2
    fi
    podman exec {{ freeipa.container_name }} test -f /etc/ipa/ca.crt 2>/dev/null
  register: _init_wait
  until: _init_wait.rc == 0
  retries: "{{ (freeipa_init_timeout / 15) | int }}"
  delay: 15
  changed_when: false
  failed_when: _init_wait.rc == 2
  when: _needs_init

# --------------------------------------------------------------------------
# Systemd unit — start/stop mode (no --new) so reboots call
# 'podman start' rather than re-running ipa-server-install.
# --------------------------------------------------------------------------
- name: Generate systemd unit for FreeIPA container
  ansible.builtin.command: >
    podman generate systemd
    --name {{ freeipa.container_name }}
    --restart-policy=always
    --files
  args:
    chdir: /etc/systemd/system
  changed_when: true
  when: _needs_init

- name: Enable FreeIPA container service (start on boot)
  ansible.builtin.systemd:
    daemon_reload: true
    name: "container-{{ freeipa.container_name }}.service"
    enabled: true
  when: _needs_init

# --------------------------------------------------------------------------
# Fetch CA certificate for use in OCP inventory
# --------------------------------------------------------------------------
- name: Fetch FreeIPA CA certificate
  ansible.builtin.shell: >
    podman exec {{ freeipa.container_name }}
    cat /etc/ipa/ca.crt
  register: _ipa_ca_cert
  changed_when: false

- name: Write CA certificate to control node
  ansible.builtin.copy:
    content: "{{ _ipa_ca_cert.stdout }}"
    dest: "{{ lookup('env', 'HOME') }}/freeipa-ca.crt"
    mode: '0644'
  delegate_to: localhost
  become: false

# --------------------------------------------------------------------------
# Summary
# --------------------------------------------------------------------------
- name: Derive base DN from domain
  ansible.builtin.set_fact:
    _base_dn: "dc={{ freeipa.domain.split('.') | join(',dc=') }}"

- name: Print FreeIPA connection details
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - "FreeIPA Server Ready"
      - "======================================================================"
      - "Web UI:           https://{{ freeipa.hostname }}"
      - "Admin user:       admin"
      - "Admin password:   {{ freeipa.admin_password }}"
      - ""
      - "Private IP:       {{ ansible_default_ipv4.address }}"
      - "  (use this in OCP inventory — reachable by cluster nodes inside the VPC)"
      - ""
      - "LDAP (plain):     ldap://{{ ansible_default_ipv4.address }}:389"
      - "LDAPS (TLS):      ldaps://{{ ansible_default_ipv4.address }}:636"
      - "Base DN:          {{ _base_dn }}"
      - "Users DN:         cn=users,cn=accounts,{{ _base_dn }}"
      - "Groups DN:        cn=groups,cn=accounts,{{ _base_dn }}"
      - ""
      - "CA cert saved to: ~/freeipa-ca.crt (on your local machine)"
      - "======================================================================"
