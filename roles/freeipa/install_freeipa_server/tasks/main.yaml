---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - freeipa.hostname is defined and freeipa.hostname != ""
      - freeipa.domain is defined and freeipa.domain != ""
      - freeipa.realm is defined and freeipa.realm != ""
      - freeipa.admin_password is defined
      - freeipa.directory_manager_password is defined
    fail_msg: "freeipa.hostname, domain, realm, admin_password, and directory_manager_password must all be defined"

# --------------------------------------------------------------------------
# Host preparation (all idempotent)
# --------------------------------------------------------------------------
- name: Set hostname on the host
  ansible.builtin.hostname:
    name: "{{ freeipa.hostname }}"

- name: Ensure hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ ansible_default_ipv4.address }}\\s+{{ freeipa.hostname }}"
    line: "{{ ansible_default_ipv4.address }}  {{ freeipa.hostname }}  {{ freeipa.hostname.split('.')[0] }}"
    state: present

- name: Ensure podman is installed
  ansible.builtin.dnf:
    name: podman
    state: present

- name: Create FreeIPA data directory
  ansible.builtin.file:
    path: "{{ freeipa.data_dir }}"
    state: directory
    mode: '0755'

- name: Pull FreeIPA image
  ansible.builtin.command: podman pull {{ freeipa.image }}
  changed_when: true
  register: _pull_result
  retries: 3
  delay: 10
  until: _pull_result.rc == 0

# --------------------------------------------------------------------------
# Determine current state.
# The CA cert lives at {{ freeipa.data_dir }}/etc/ipa/ca.crt on the host
# because the container symlinks /etc/ipa → /data/etc/ipa. Checking the
# host path avoids 'podman exec' entirely, which fails if the container
# is stopped or in any other non-running state.
# --------------------------------------------------------------------------
- name: Check if FreeIPA data directory has a completed installation
  ansible.builtin.stat:
    path: "{{ freeipa.data_dir }}/etc/ipa/ca.crt"
  register: _ca_stat

- name: Check if FreeIPA container exists
  ansible.builtin.command: podman inspect {{ freeipa.container_name }}
  register: _container_inspect
  changed_when: false
  failed_when: false

- name: Set container state facts
  ansible.builtin.set_fact:
    _ca_exists: "{{ _ca_stat.stat.exists | default(false) }}"
    _container_exists: "{{ _container_inspect.rc == 0 }}"
    _container_status: >-
      {{ (_container_inspect.stdout | from_json)[0].State.Status
         if _container_inspect.rc == 0 else 'missing' }}

- name: Set initialization flag
  ansible.builtin.set_fact:
    _needs_init: "{{ not _ca_exists }}"

# --------------------------------------------------------------------------
# If a container exists but init never completed, remove it and start fresh.
# Stop the systemd service first so it doesn't reclaim ports immediately.
# --------------------------------------------------------------------------
- name: Stop FreeIPA systemd service before recovery (releases ports)
  ansible.builtin.systemd:
    name: "container-{{ freeipa.container_name }}.service"
    state: stopped
    enabled: false
  failed_when: false
  when: _needs_init and _container_exists

- name: Remove stale/incomplete FreeIPA container
  ansible.builtin.command: podman rm -f {{ freeipa.container_name }}
  when: _needs_init and _container_exists
  changed_when: true

- name: Wipe partial FreeIPA data directory
  ansible.builtin.file:
    path: "{{ freeipa.data_dir }}"
    state: absent
  when: _needs_init and _container_exists

- name: Recreate FreeIPA data directory
  ansible.builtin.file:
    path: "{{ freeipa.data_dir }}"
    state: directory
    mode: '0755'
  when: _needs_init and _container_exists

# --------------------------------------------------------------------------
# Start existing running container if it already has a completed install
# --------------------------------------------------------------------------
- name: Start existing container if stopped (installation already complete)
  ansible.builtin.command: podman start {{ freeipa.container_name }}
  when: not _needs_init and _container_exists and _container_status != 'running'
  changed_when: true

# --------------------------------------------------------------------------
# Initialize (only when needed).
# --systemd=true    mounts cgroups rw so the in-container systemd can manage
#                   IPA services (Directory Server, Kerberos, Apache, etc.)
# --cap-add SYS_RESOURCE  allows setrlimit() calls in the IPA entrypoint
# --log-driver=k8s-file   forces file-based logging (host default may be
#                          journald, which makes 'podman logs' return empty)
# DNS setup omitted: --setup-dns would bind port 53 which the AWS resolver
# already owns. FreeIPA works as a pure LDAP/Kerberos server without DNS.
# --------------------------------------------------------------------------
- name: Initialize FreeIPA server container (takes 5-10 minutes)
  ansible.builtin.command: >
    podman run -d
    --name {{ freeipa.container_name }}
    --hostname {{ freeipa.hostname }}
    --systemd=true
    --cap-add SYS_RESOURCE
    --log-driver=k8s-file
    {% for port in freeipa_ports %}-p {{ port }} {% endfor %}
    -v {{ freeipa.data_dir }}:/data:Z
    {{ freeipa.image }}
    ipa-server-install
    --unattended
    --hostname={{ freeipa.hostname }}
    --domain={{ freeipa.domain }}
    --realm={{ freeipa.realm }}
    --admin-password={{ freeipa.admin_password }}
    --ds-password={{ freeipa.directory_manager_password }}
    --no-ntp
    --skip-conncheck
  when: _needs_init
  changed_when: true
  no_log: true

# --------------------------------------------------------------------------
# Wait for initialization by watching the host filesystem.
# The FreeIPA container symlinks /etc/ipa → /data/etc/ipa, so the CA cert
# appears at {{ freeipa.data_dir }}/etc/ipa/ca.crt on the host as soon as
# ipa-server-install completes — no 'podman exec' required.
# If it times out, the rescue block dumps full diagnostics.
# --------------------------------------------------------------------------
- name: Wait for FreeIPA initialization (watching host filesystem)
  when: _needs_init
  block:
    - name: Wait for CA cert to appear in data volume
      ansible.builtin.wait_for:
        path: "{{ freeipa.data_dir }}/etc/ipa/ca.crt"
        state: present
        timeout: "{{ freeipa_init_timeout }}"
        sleep: 15
        msg: "Timed out waiting for FreeIPA CA cert at {{ freeipa.data_dir }}/etc/ipa/ca.crt"

  rescue:
    - name: Collect container diagnostics
      ansible.builtin.shell: |
        echo "=== Container status ==="
        podman inspect {{ freeipa.container_name }} \
          --format 'Status: {{ "{{" }}.State.Status{{ "}}" }}, ExitCode: {{ "{{" }}.State.ExitCode{{ "}}" }}' \
          2>/dev/null || echo "Container not found"

        echo ""
        echo "=== podman logs (last 100 lines) ==="
        podman logs --tail=100 {{ freeipa.container_name }} 2>&1 || echo "(no podman logs)"

        echo ""
        echo "=== journalctl for container (last 50 lines) ==="
        journalctl CONTAINER_NAME={{ freeipa.container_name }} --no-pager -n 50 2>/dev/null \
          || echo "(no journald entries)"

        echo ""
        echo "=== Data directory contents ==="
        ls -la {{ freeipa.data_dir }}/ 2>/dev/null || echo "(data dir empty or missing)"
      register: _diagnostics
      changed_when: false
      failed_when: false

    - name: Show diagnostics
      ansible.builtin.debug:
        msg: "{{ _diagnostics.stdout_lines }}"

    - name: Fail with diagnostic context
      ansible.builtin.fail:
        msg: >
          FreeIPA initialization timed out or failed.
          See diagnostic output above for container logs and status.

# --------------------------------------------------------------------------
# Systemd unit — start/stop mode (no --new).
# --------------------------------------------------------------------------
- name: Generate systemd unit for FreeIPA container
  ansible.builtin.command: >
    podman generate systemd
    --name {{ freeipa.container_name }}
    --restart-policy=always
    --files
  args:
    chdir: /etc/systemd/system
  changed_when: true
  when: _needs_init

- name: Enable FreeIPA container service (start on boot)
  ansible.builtin.systemd:
    daemon_reload: true
    name: "container-{{ freeipa.container_name }}.service"
    enabled: true
  when: _needs_init

# --------------------------------------------------------------------------
# Fetch CA certificate for use in OCP inventory
# --------------------------------------------------------------------------
- name: Fetch FreeIPA CA certificate from data volume
  ansible.builtin.slurp:
    src: "{{ freeipa.data_dir }}/etc/ipa/ca.crt"
  register: _ca_cert_raw

- name: Write CA certificate to control node
  ansible.builtin.copy:
    content: "{{ _ca_cert_raw.content | b64decode }}"
    dest: "{{ lookup('env', 'HOME') }}/freeipa-ca.crt"
    mode: '0644'
  delegate_to: localhost
  become: false

# --------------------------------------------------------------------------
# Summary
# --------------------------------------------------------------------------
- name: Derive base DN from domain
  ansible.builtin.set_fact:
    _base_dn: "dc={{ freeipa.domain.split('.') | join(',dc=') }}"

- name: Print FreeIPA connection details
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - "FreeIPA Server Ready"
      - "======================================================================"
      - "Web UI:           https://{{ freeipa.hostname }}"
      - "Admin user:       admin"
      - "Admin password:   {{ freeipa.admin_password }}"
      - ""
      - "Private IP:       {{ ansible_default_ipv4.address }}"
      - "  (use this in OCP inventory — reachable by cluster nodes inside the VPC)"
      - ""
      - "LDAP (plain):     ldap://{{ ansible_default_ipv4.address }}:389"
      - "LDAPS (TLS):      ldaps://{{ ansible_default_ipv4.address }}:636"
      - "Base DN:          {{ _base_dn }}"
      - "Users DN:         cn=users,cn=accounts,{{ _base_dn }}"
      - "Groups DN:        cn=groups,cn=accounts,{{ _base_dn }}"
      - ""
      - "CA cert saved to: ~/freeipa-ca.crt (on your local machine)"
      - "======================================================================"
