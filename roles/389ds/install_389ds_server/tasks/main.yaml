---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - ds389.root_password is defined and ds389.root_password != ""
      - ds389.suffix is defined and ds389.suffix != ""
      - hub_kubeconfig is defined and hub_kubeconfig != ""
    fail_msg: "ds389.root_password, ds389.suffix, and hub_kubeconfig must be defined"

# --------------------------------------------------------------------------
# Determine cluster Quay registry URL (auto-detect if not set in inventory)
# --------------------------------------------------------------------------
- name: Get Quay route URL from cluster
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc get route
    -n {{ disconnected.quay_mirror.namespace | default('local-quay') }}
    --kubeconfig {{ hub_kubeconfig }}
    -l quay-component=quay-app-route
    -o jsonpath='{.items[0].spec.host}' 2>/dev/null || true
  register: _quay_route
  changed_when: false
  become: false
  when: quay_registry_url | default('') == ""

- name: Derive Quay URL from inventory if route query returned empty
  ansible.builtin.set_fact:
    _quay_url_derived: >-
      {{ disconnected.quay_mirror.registry_name | default('quay-registry') -}}
      -quay-{{ disconnected.quay_mirror.namespace | default('local-quay') -}}
      .apps.acm-hub.{{ base_domain }}
  when:
    - quay_registry_url | default('') == ""
    - _quay_route.stdout | default('') | trim == ""

- name: Set Quay registry URL fact
  ansible.builtin.set_fact:
    _quay_url: >-
      {{ quay_registry_url if (quay_registry_url | default('')) != ''
         else (_quay_route.stdout | default('') | trim
               if (_quay_route.stdout | default('') | trim != '')
               else _quay_url_derived | default('')) }}

- name: Set target image reference in cluster Quay
  ansible.builtin.set_fact:
    _target_image: "{{ _quay_url }}/{{ quay_org }}/389ds/dirsrv:latest"

# --------------------------------------------------------------------------
# Mirror 389 DS image from internet to cluster Quay (jumphost has internet)
# Podman tasks run as root (rootful podman). oc tasks run as ec2-user.
# --------------------------------------------------------------------------
- name: Pull 389 DS image on jumphost
  ansible.builtin.command: podman pull {{ ds389.source_image }}
  changed_when: true
  become: true

- name: Tag image for cluster Quay
  ansible.builtin.command: podman tag {{ ds389.source_image }} {{ _target_image }}
  changed_when: true
  become: true

- name: Login to cluster Quay
  ansible.builtin.command: >
    podman login {{ _quay_url }}
    -u {{ quay_admin_user }}
    -p {{ quay_admin_password }}
    --tls-verify=false
  changed_when: false
  become: true
  no_log: true

- name: Push 389 DS image to cluster Quay
  ansible.builtin.command: podman push {{ _target_image }} --tls-verify=false
  changed_when: true
  become: true

# --------------------------------------------------------------------------
# Deploy 389 DS to OCP as Deployment + ClusterIP Service + PVC
# oc runs as ec2-user (become: false) — oc is in ec2-user's ~/.local/bin
# --------------------------------------------------------------------------
- name: Create PVC for 389 DS data
  ansible.builtin.shell:
    cmd: "{{ bin_dir | default('~/.local/bin') }}/oc apply --kubeconfig {{ hub_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ ds389.deployment_name }}-data
        namespace: {{ ds389.namespace }}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ ds389.pvc_size }}
        {{ ('storageClassName: ' + ds389.storage_class) if ds389.storage_class | default('') != '' else '' }}
  changed_when: true
  become: false

- name: Create 389 DS Deployment
  ansible.builtin.shell:
    cmd: "{{ bin_dir | default('~/.local/bin') }}/oc apply --kubeconfig {{ hub_kubeconfig }} -f -"
    stdin: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ ds389.deployment_name }}
        namespace: {{ ds389.namespace }}
        labels:
          app: {{ ds389.deployment_name }}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: {{ ds389.deployment_name }}
        template:
          metadata:
            labels:
              app: {{ ds389.deployment_name }}
          spec:
            containers:
              - name: 389ds
                image: {{ _target_image }}
                imagePullPolicy: Always
                ports:
                  - containerPort: {{ ds389.container_port }}
                env:
                  - name: DS_DM_PASSWORD
                    value: "{{ ds389.root_password }}"
                  - name: DS_SUFFIX_NAME
                    value: "{{ ds389.suffix }}"
                volumeMounts:
                  - name: data
                    mountPath: /data
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: {{ ds389.deployment_name }}-data
  changed_when: true
  become: false
  no_log: true

# LoadBalancer exposes LDAP externally via AWS NLB so both hub and spoke
# OAuth controllers can reach it (spoke clusters connect to hub external endpoints
# the same way they pull images from the hub's Quay registry).
# Changing service type after creation is not allowed — delete first if it exists.
- name: Delete existing ds389 Service to allow recreation as LoadBalancer
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc delete service {{ ds389.service_name }}
    -n {{ ds389.namespace }}
    --kubeconfig {{ hub_kubeconfig }}
    --ignore-not-found
  changed_when: true
  become: false

- name: Create 389 DS Service (LoadBalancer — accessible from all clusters)
  ansible.builtin.shell:
    cmd: "{{ bin_dir | default('~/.local/bin') }}/oc apply --kubeconfig {{ hub_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ ds389.service_name }}
        namespace: {{ ds389.namespace }}
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      spec:
        type: LoadBalancer
        selector:
          app: {{ ds389.deployment_name }}
        ports:
          - name: ldap
            port: 389
            targetPort: {{ ds389.container_port }}
  changed_when: true
  become: false

- name: Get node port assigned to ds389 service
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc get service {{ ds389.service_name }}
    -n {{ ds389.namespace }}
    --kubeconfig {{ hub_kubeconfig }}
    -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null
  register: _node_port
  changed_when: false
  become: false

- name: Get cluster infrastructure name
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc get infrastructure cluster
    --kubeconfig {{ hub_kubeconfig }}
    -o jsonpath='{.status.infrastructureName}' 2>/dev/null
  register: _infra_name
  changed_when: false
  become: false

- name: Get worker node instance ID
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc get nodes
    --kubeconfig {{ hub_kubeconfig }}
    -l node-role.kubernetes.io/worker
    -o jsonpath='{.items[0].spec.providerID}'
    | sed 's|aws:///[^/]*/||'
  register: _worker_instance_id
  changed_when: false
  become: false
  when:
    - aws is defined
    - (aws.aws_access_key_id | default('')) != ''
    - _node_port.stdout != ''

- name: Get worker node security group ID from instance
  ansible.builtin.shell: >
    /usr/local/bin/aws ec2 describe-instances
    --region {{ aws.aws_region }}
    --instance-ids {{ _worker_instance_id.stdout | trim }}
    --query 'Reservations[0].Instances[0].SecurityGroups[?contains(GroupName, `node`)].GroupId | [0]'
    --output text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws.aws_secret_access_key }}"
  register: _worker_sg
  changed_when: false
  when:
    - aws is defined
    - (aws.aws_access_key_id | default('')) != ''
    - _worker_instance_id.stdout is defined
    - _worker_instance_id.stdout | trim != ''

- name: Open node port on worker security group for NLB health checks and traffic
  ansible.builtin.shell: >
    /usr/local/bin/aws ec2 authorize-security-group-ingress
    --region {{ aws.aws_region }}
    --group-id {{ _worker_sg.stdout | trim }}
    --protocol tcp
    --port {{ _node_port.stdout | trim }}
    --cidr 0.0.0.0/0 2>&1
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws.aws_secret_access_key }}"
  register: _sg_node_port
  changed_when: _sg_node_port.rc == 0
  failed_when: >
    _sg_node_port.rc != 0 and
    'InvalidPermission.Duplicate' not in (_sg_node_port.stdout + _sg_node_port.stderr)
  when:
    - aws is defined
    - (aws.aws_access_key_id | default('')) != ''
    - _worker_sg.stdout is defined
    - _worker_sg.stdout | trim not in ['None', '']

- name: Wait for NLB security group to be assigned to the load balancer
  ansible.builtin.shell: >
    /usr/local/bin/aws elbv2 describe-load-balancers
    --region {{ aws.aws_region }}
    --query "LoadBalancers[?contains(DNSName, '{{ ds389.service_name }}')].SecurityGroups | [0][0]"
    --output text 2>/dev/null || true
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws.aws_secret_access_key }}"
  register: _nlb_sg_check
  until: _nlb_sg_check.stdout | trim | length > 0
  retries: 20
  delay: 15
  changed_when: false
  when:
    - aws is defined
    - (aws.aws_access_key_id | default('')) != ''
    - _worker_sg.stdout is defined

- name: Get NLB ARN to find its security group
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc get service {{ ds389.service_name }}
    -n {{ ds389.namespace }}
    --kubeconfig {{ hub_kubeconfig }}
    -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null
  register: _svc_lb_hostname
  changed_when: false
  become: false
  when:
    - aws is defined
    - (aws.aws_access_key_id | default('')) != ''
    - _worker_sg.stdout is defined

- name: Get NLB security group ID
  ansible.builtin.shell: >
    /usr/local/bin/aws elbv2 describe-load-balancers
    --region {{ aws.aws_region }}
    --query "LoadBalancers[?DNSName=='{{ _svc_lb_hostname.stdout | trim }}'].SecurityGroups | [0][0]"
    --output text
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws.aws_secret_access_key }}"
  register: _nlb_sg_id
  changed_when: false
  retries: 10
  delay: 15
  until: _nlb_sg_id.stdout | trim | length > 0
  when:
    - aws is defined
    - (aws.aws_access_key_id | default('')) != ''
    - _svc_lb_hostname.stdout is defined
    - _svc_lb_hostname.stdout | trim != ''

- name: Open LDAP port 389 on NLB security group
  ansible.builtin.shell: >
    /usr/local/bin/aws ec2 authorize-security-group-ingress
    --region {{ aws.aws_region }}
    --group-id {{ _nlb_sg_id.stdout | trim }}
    --protocol tcp --port 389 --cidr 0.0.0.0/0 2>&1
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws.aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws.aws_secret_access_key }}"
  register: _nlb_sg_rule
  changed_when: _nlb_sg_rule.rc == 0
  failed_when: >
    _nlb_sg_rule.rc != 0 and
    'InvalidPermission.Duplicate' not in (_nlb_sg_rule.stdout + _nlb_sg_rule.stderr)
  when:
    - aws is defined
    - (aws.aws_access_key_id | default('')) != ''
    - _nlb_sg_id.stdout is defined
    - _nlb_sg_id.stdout | trim not in ['None', '']

- name: Wait for LoadBalancer DNS to be assigned
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc get service {{ ds389.service_name }}
    -n {{ ds389.namespace }}
    --kubeconfig {{ hub_kubeconfig }}
    -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null
  register: _lb_dns
  until: _lb_dns.stdout | trim != ''
  retries: 40
  delay: 15
  changed_when: false
  become: false

- name: Set LoadBalancer DNS fact
  ansible.builtin.set_fact:
    ds389_lb_dns: "{{ _lb_dns.stdout | trim }}"

# --------------------------------------------------------------------------
# Wait for Deployment rollout to complete
# --------------------------------------------------------------------------
- name: Wait for 389 DS Deployment to be available
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc rollout status
    deployment/{{ ds389.deployment_name }}
    -n {{ ds389.namespace }}
    --kubeconfig {{ hub_kubeconfig }}
    --timeout=300s
  changed_when: false
  become: false

# --------------------------------------------------------------------------
# Wait for LDAP port via oc exec (no network path needed)
# --------------------------------------------------------------------------
- name: Wait for 389 DS LDAP to accept connections (via oc exec)
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc exec
    -n {{ ds389.namespace }}
    deployment/{{ ds389.deployment_name }}
    --kubeconfig {{ hub_kubeconfig }}
    -- ldapsearch -x
    -H ldap://localhost:{{ ds389.container_port }}
    -b "" -s base namingContexts 2>/dev/null
  register: _ldap_ready
  until: _ldap_ready.rc == 0
  retries: "{{ (ds389_init_timeout / 5) | int }}"
  delay: 5
  changed_when: false
  become: false

# --------------------------------------------------------------------------
# Create suffix backend + base entry if missing
# --------------------------------------------------------------------------
- name: Check if suffix base entry exists
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc exec
    -n {{ ds389.namespace }}
    deployment/{{ ds389.deployment_name }}
    --kubeconfig {{ hub_kubeconfig }}
    -- ldapsearch -x
    -H ldap://localhost:{{ ds389.container_port }}
    -b '{{ ds389.suffix }}' -s base dn 2>/dev/null
  register: _suffix_check
  changed_when: false
  failed_when: _suffix_check.rc not in [0, 32]
  become: false

- name: Create backend and base entry via dsconf (suffix missing)
  ansible.builtin.shell: |
    {{ bin_dir | default('~/.local/bin') }}/oc exec \
      -n {{ ds389.namespace }} \
      deployment/{{ ds389.deployment_name }} \
      --kubeconfig {{ hub_kubeconfig }} \
      -- bash -c "
        INSTANCE=\$(ls /etc/dirsrv/ 2>/dev/null | grep '^slapd-' | head -1 | sed 's/slapd-//')
        if [ -z \"\$INSTANCE\" ]; then echo 'ERROR: no instance found' >&2; exit 1; fi
        dsconf \"\$INSTANCE\" backend create \
          --suffix '{{ ds389.suffix }}' \
          --be-name userroot \
          --create-suffix 2>&1
      "
  register: _backend_create
  changed_when: _backend_create.rc == 0
  failed_when: >
    _backend_create.rc != 0 and
    'already exists' not in (_backend_create.stdout + _backend_create.stderr) | lower
  when: _suffix_check.rc == 32
  become: false

# --------------------------------------------------------------------------
# Add read ACI so service account can search the directory
# --------------------------------------------------------------------------
- name: Add read ACI for authenticated users
  ansible.builtin.shell: |
    {{ bin_dir | default('~/.local/bin') }}/oc exec -i \
      -n {{ ds389.namespace }} \
      deployment/{{ ds389.deployment_name }} \
      --kubeconfig {{ hub_kubeconfig }} \
      -- ldapmodify -x \
      -H ldap://localhost:{{ ds389.container_port }} \
      -D '{{ ds389.root_dn }}' \
      -w '{{ ds389.root_password }}' << 'LDIF'
    dn: {{ ds389.suffix }}
    changetype: modify
    add: aci
    aci: (targetattr="*")(version 3.0; acl "Allow authenticated read"; allow (read,search,compare) userdn="ldap:///all";)
    LDIF
  register: _aci_result
  changed_when: _aci_result.rc == 0
  failed_when: _aci_result.rc not in [0, 20]
  become: false
  no_log: true

# --------------------------------------------------------------------------
# Summary
# --------------------------------------------------------------------------
- name: Set internal LDAP service URL
  ansible.builtin.set_fact:
    _ldap_svc_url: "ldap://{{ ds389.service_name }}.{{ ds389.namespace }}.svc.cluster.local:389"

- name: Print 389 DS connection details
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - "389 Directory Server Ready (running inside OCP)"
      - "======================================================================"
      - "Deployment:     {{ ds389.namespace }}/{{ ds389.deployment_name }}"
      - "LoadBalancer:   {{ ds389_lb_dns }}:389"
      - ""
      - "Update disconnected-aws-inventory with:"
      - "  ldap:"
      - "    url: \"ldap://{{ ds389_lb_dns }}:389/ou=people,{{ ds389.suffix }}?uid\""
      - "  groupsync:"
      - "    ldap_url: \"ldap://{{ ds389_lb_dns }}:389\""
      - ""
      - "Suffix:      {{ ds389.suffix }}"
      - "Root DN:     {{ ds389.root_dn }}"
      - "======================================================================"
