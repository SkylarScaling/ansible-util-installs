---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - ds389.root_password is defined and ds389.root_password != ""
      - ds389.suffix is defined and ds389.suffix != ""
      - hub_kubeconfig is defined and hub_kubeconfig != ""
    fail_msg: "ds389.root_password, ds389.suffix, and hub_kubeconfig must be defined"

# --------------------------------------------------------------------------
# Determine cluster Quay registry URL (auto-detect if not set in inventory)
# --------------------------------------------------------------------------
# Auto-detect Quay URL from inventory variables when not explicitly set.
# Pattern: quay-registry-<registry_name>-<namespace>.apps.<hub_name>.<base_domain>
- name: Get Quay route URL from cluster
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc get route
    -n {{ disconnected.quay_mirror.namespace | default('local-quay') }}
    --kubeconfig {{ hub_kubeconfig }}
    -l quay-component=quay-app-route
    -o jsonpath='{.items[0].spec.host}' 2>/dev/null || true
  register: _quay_route
  changed_when: false
  when: quay_registry_url | default('') == ""

- name: Derive Quay URL from inventory if route query returned empty
  ansible.builtin.set_fact:
    _quay_url_derived: >-
      {{ disconnected.quay_mirror.registry_name | default('quay-registry') -}}
      -{{ disconnected.quay_mirror.namespace | default('local-quay') | replace('-', '-') -}}
      .apps.acm-hub.{{ base_domain }}
  when:
    - quay_registry_url | default('') == ""
    - _quay_route.stdout | default('') | trim == ""

- name: Set Quay registry URL fact
  ansible.builtin.set_fact:
    _quay_url: >-
      {{ quay_registry_url if (quay_registry_url | default('')) != ''
         else (_quay_route.stdout | default('') | trim
               if (_quay_route.stdout | default('') | trim != '')
               else _quay_url_derived | default('')) }}

- name: Set target image reference in cluster Quay
  ansible.builtin.set_fact:
    _target_image: "{{ _quay_url }}/{{ quay_org }}/389ds/dirsrv:latest"

# --------------------------------------------------------------------------
# Mirror 389 DS image from internet to cluster Quay (jumphost has internet)
# --------------------------------------------------------------------------
- name: Pull 389 DS image on jumphost
  ansible.builtin.command: podman pull {{ ds389.source_image }}
  changed_when: true
  become: true

- name: Tag image for cluster Quay
  ansible.builtin.command: podman tag {{ ds389.source_image }} {{ _target_image }}
  changed_when: true
  become: true

- name: Login to cluster Quay
  ansible.builtin.command: >
    podman login {{ _quay_url }}
    -u {{ quay_admin_user }}
    -p {{ quay_admin_password }}
    --tls-verify=false
  changed_when: false
  become: true

- name: Push 389 DS image to cluster Quay
  ansible.builtin.command: podman push {{ _target_image }} --tls-verify=false
  changed_when: true
  become: true

# --------------------------------------------------------------------------
# Deploy 389 DS to OCP as Deployment + ClusterIP Service + PVC
# --------------------------------------------------------------------------
- name: Create PVC for 389 DS data
  ansible.builtin.shell:
    cmd: "{{ bin_dir | default('~/.local/bin') }}/oc apply --kubeconfig {{ hub_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ ds389.deployment_name }}-data
        namespace: {{ ds389.namespace }}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ ds389.pvc_size }}
        {{ ('storageClassName: ' + ds389.storage_class) if ds389.storage_class | default('') != '' else '' }}
  changed_when: true

- name: Create 389 DS Deployment
  ansible.builtin.shell:
    cmd: "{{ bin_dir | default('~/.local/bin') }}/oc apply --kubeconfig {{ hub_kubeconfig }} -f -"
    stdin: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ ds389.deployment_name }}
        namespace: {{ ds389.namespace }}
        labels:
          app: {{ ds389.deployment_name }}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: {{ ds389.deployment_name }}
        template:
          metadata:
            labels:
              app: {{ ds389.deployment_name }}
          spec:
            containers:
              - name: 389ds
                image: {{ _target_image }}
                imagePullPolicy: Always
                ports:
                  - containerPort: {{ ds389.container_port }}
                env:
                  - name: DS_DM_PASSWORD
                    value: "{{ ds389.root_password }}"
                  - name: DS_SUFFIX_NAME
                    value: "{{ ds389.suffix }}"
                volumeMounts:
                  - name: data
                    mountPath: /data
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: {{ ds389.deployment_name }}-data
  changed_when: true
  no_log: true

- name: Create 389 DS Service (ClusterIP — reachable only within the cluster)
  ansible.builtin.shell:
    cmd: "{{ bin_dir | default('~/.local/bin') }}/oc apply --kubeconfig {{ hub_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Service
      metadata:
        name: {{ ds389.service_name }}
        namespace: {{ ds389.namespace }}
      spec:
        type: ClusterIP
        selector:
          app: {{ ds389.deployment_name }}
        ports:
          - name: ldap
            port: 389
            targetPort: {{ ds389.container_port }}
  changed_when: true

# --------------------------------------------------------------------------
# Wait for Deployment rollout to complete
# --------------------------------------------------------------------------
- name: Wait for 389 DS Deployment to be available
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc rollout status
    deployment/{{ ds389.deployment_name }}
    -n {{ ds389.namespace }}
    --kubeconfig {{ hub_kubeconfig }}
    --timeout=300s
  changed_when: false

# --------------------------------------------------------------------------
# Wait for LDAP port via oc exec (no network path needed)
# --------------------------------------------------------------------------
- name: Wait for 389 DS LDAP to accept connections (via oc exec)
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc exec
    -n {{ ds389.namespace }}
    deployment/{{ ds389.deployment_name }}
    --kubeconfig {{ hub_kubeconfig }}
    -- ldapsearch -x
    -H ldap://localhost:{{ ds389.container_port }}
    -b "" -s base namingContexts 2>/dev/null
  register: _ldap_ready
  until: _ldap_ready.rc == 0
  retries: "{{ (ds389_init_timeout / 5) | int }}"
  delay: 5
  changed_when: false

# --------------------------------------------------------------------------
# Create suffix backend + base entry if missing
# --------------------------------------------------------------------------
- name: Check if suffix base entry exists
  ansible.builtin.shell: >
    {{ bin_dir | default('~/.local/bin') }}/oc exec
    -n {{ ds389.namespace }}
    deployment/{{ ds389.deployment_name }}
    --kubeconfig {{ hub_kubeconfig }}
    -- ldapsearch -x
    -H ldap://localhost:{{ ds389.container_port }}
    -b '{{ ds389.suffix }}' -s base dn 2>/dev/null
  register: _suffix_check
  changed_when: false
  failed_when: _suffix_check.rc not in [0, 32]

- name: Create backend and base entry via dsconf (suffix missing)
  ansible.builtin.shell: |
    {{ bin_dir | default('~/.local/bin') }}/oc exec \
      -n {{ ds389.namespace }} \
      deployment/{{ ds389.deployment_name }} \
      --kubeconfig {{ hub_kubeconfig }} \
      -- bash -c "
        INSTANCE=\$(ls /etc/dirsrv/ 2>/dev/null | grep '^slapd-' | head -1 | sed 's/slapd-//')
        if [ -z \"\$INSTANCE\" ]; then echo 'ERROR: no instance found' >&2; exit 1; fi
        dsconf \"\$INSTANCE\" backend create \
          --suffix '{{ ds389.suffix }}' \
          --be-name userroot \
          --create-suffix 2>&1
      "
  register: _backend_create
  changed_when: _backend_create.rc == 0
  failed_when: >
    _backend_create.rc != 0 and
    'already exists' not in (_backend_create.stdout + _backend_create.stderr) | lower
  when: _suffix_check.rc == 32

# --------------------------------------------------------------------------
# Add read ACI so service account can search the directory
# --------------------------------------------------------------------------
- name: Add read ACI for authenticated users
  ansible.builtin.shell: |
    {{ bin_dir | default('~/.local/bin') }}/oc exec -i \
      -n {{ ds389.namespace }} \
      deployment/{{ ds389.deployment_name }} \
      --kubeconfig {{ hub_kubeconfig }} \
      -- ldapmodify -x \
      -H ldap://localhost:{{ ds389.container_port }} \
      -D '{{ ds389.root_dn }}' \
      -w '{{ ds389.root_password }}' << 'LDIF'
    dn: {{ ds389.suffix }}
    changetype: modify
    add: aci
    aci: (targetattr="*")(version 3.0; acl "Allow authenticated read"; allow (read,search,compare) userdn="ldap:///all";)
    LDIF
  register: _aci_result
  changed_when: _aci_result.rc == 0
  failed_when: _aci_result.rc not in [0, 20]
  no_log: true

# --------------------------------------------------------------------------
# Summary
# --------------------------------------------------------------------------
- name: Set internal LDAP service URL
  ansible.builtin.set_fact:
    _ldap_svc_url: "ldap://{{ ds389.service_name }}.{{ ds389.namespace }}.svc.cluster.local:389"

- name: Print 389 DS connection details
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - "389 Directory Server Ready (running inside OCP)"
      - "======================================================================"
      - "Deployment:  {{ ds389.namespace }}/{{ ds389.deployment_name }}"
      - ""
      - "LDAP URL:    {{ _ldap_svc_url }}"
      - "  (cluster-internal — reachable from all pods and OCP controllers)"
      - ""
      - "Suffix:      {{ ds389.suffix }}"
      - "Root DN:     {{ ds389.root_dn }}"
      - "======================================================================"
