---
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - ds389.root_password is defined and ds389.root_password != ""
      - ds389.suffix is defined and ds389.suffix != ""
    fail_msg: "ds389.root_password and ds389.suffix must be defined"

# --------------------------------------------------------------------------
# Host preparation
# --------------------------------------------------------------------------
- name: Ensure podman is installed
  ansible.builtin.dnf:
    name: podman
    state: present

- name: Create 389 DS data directory
  ansible.builtin.file:
    path: "{{ ds389.data_dir }}"
    state: directory
    mode: '0755'

- name: Pull 389 DS image
  ansible.builtin.command: podman pull {{ ds389.image }}
  changed_when: true
  register: _pull_result
  retries: 3
  delay: 10
  until: _pull_result.rc == 0

# --------------------------------------------------------------------------
# Determine current state
# --------------------------------------------------------------------------
- name: Check if 389 DS container exists
  ansible.builtin.command: podman inspect {{ ds389.container_name }}
  register: _container_inspect
  changed_when: false
  failed_when: false

- name: Set container state facts
  ansible.builtin.set_fact:
    _container_exists: "{{ _container_inspect.rc == 0 }}"
    _container_status: >-
      {{ (_container_inspect.stdout | from_json)[0].State.Status
         if _container_inspect.rc == 0 else 'missing' }}

# --------------------------------------------------------------------------
# Start / create container.
# The image auto-initialises on first run when /data is empty using the
# DS_DM_PASSWORD and DS_SUFFIX_NAME environment variables. On subsequent
# runs it detects existing data and just starts the LDAP service.
# No separate dscreate phase required.
# --------------------------------------------------------------------------
- name: Start existing container if stopped
  ansible.builtin.command: podman start {{ ds389.container_name }}
  when: _container_exists and _container_status != 'running'
  changed_when: true

- name: Run 389 DS container (first time or after full cleanup)
  ansible.builtin.command: >
    podman run -d
    --name {{ ds389.container_name }}
    -p {{ ds389_ldap_port }}:3389
    -p {{ ds389_ldaps_port }}:3636
    -v {{ ds389.data_dir }}:/data:Z
    -e DS_DM_PASSWORD={{ ds389.root_password }}
    -e DS_SUFFIX_NAME={{ ds389.suffix }}
    {{ ds389.image }}
  when: not _container_exists
  changed_when: true
  no_log: true

# --------------------------------------------------------------------------
# Wait for LDAP port.
# Auto-init takes ~30 seconds on first run; on subsequent runs 389 DS
# starts in a few seconds. wait_for on a port does fast TCP probes.
# --------------------------------------------------------------------------
- name: Wait for 389 DS LDAP port to be available
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ds389_ldap_port }}"
    timeout: "{{ ds389_init_timeout }}"
    delay: 5
    msg: "389 DS did not start within {{ ds389_init_timeout }}s — check: podman logs {{ ds389.container_name }}"

# --------------------------------------------------------------------------
# Systemd unit for persistence across reboots
# --------------------------------------------------------------------------
- name: Generate systemd unit for 389 DS container
  ansible.builtin.command: >
    podman generate systemd
    --name {{ ds389.container_name }}
    --restart-policy=always
    --files
  args:
    chdir: /etc/systemd/system
  changed_when: true
  when: not _container_exists

- name: Enable 389 DS container service
  ansible.builtin.systemd:
    daemon_reload: true
    name: "container-{{ ds389.container_name }}.service"
    enabled: true
  when: not _container_exists

# --------------------------------------------------------------------------
# Summary
# --------------------------------------------------------------------------
- name: Print 389 DS connection details
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - "389 Directory Server Ready"
      - "======================================================================"
      - "Private IP:   {{ ansible_default_ipv4.address }}"
      - "  (use this in OCP inventory — reachable inside the VPC)"
      - ""
      - "LDAP:         ldap://{{ ansible_default_ipv4.address }}:{{ ds389_ldap_port }}"
      - "LDAPS:        ldaps://{{ ansible_default_ipv4.address }}:{{ ds389_ldaps_port }}"
      - "Suffix:       {{ ds389.suffix }}"
      - "Root DN:      {{ ds389.root_dn }}"
      - "======================================================================"
