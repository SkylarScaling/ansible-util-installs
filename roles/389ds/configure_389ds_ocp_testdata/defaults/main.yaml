---
ds389:
  namespace: "openshift-config"
  deployment_name: "389ds"
  service_name: "389ds"
  root_dn: "cn=Directory Manager"
  root_password: "ChangeMe123!"
  suffix: "dc=example,dc=com"
  container_port: 3389

hub_kubeconfig: "~/tmp/acm-global-hub/install/acm-hub/auth/kubeconfig"

ds389_ldap_service_account:
  username: "ldap-svc"
  cn: "LDAP Service Account"
  sn: "ServiceAccount"
  password: "ChangeMe123!"

ds389_ocp_groups:
  - openshift-admins
  - openshift-developers
  - openshift-viewers

ds389_ocp_users:
  - username: ocp-admin
    cn: "OCP Admin"
    sn: "Admin"
    password: "ChangeMe123!"
    groups:
      - openshift-admins
  - username: ocp-dev
    cn: "OCP Developer"
    sn: "Developer"
    password: "ChangeMe123!"
    groups:
      - openshift-developers
  - username: ocp-viewer
    cn: "OCP Viewer"
    sn: "Viewer"
    password: "ChangeMe123!"
    groups:
      - openshift-viewers
