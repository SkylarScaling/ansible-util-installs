---
# All LDAP operations go through 'oc exec' into the 389 DS pod.
# No SSH + ldapadd on the jumphost — the pod is inside the cluster.
- name: Set internal LDAP service URL
  ansible.builtin.set_fact:
    _svc_url: "ldap://{{ ds389.service_name }}.{{ ds389.namespace }}.svc.cluster.local:389"
    _exec_prefix: >-
      {{ bin_dir | default('~/.local/bin') }}/oc exec -i
      -n {{ ds389.namespace }}
      deployment/{{ ds389.deployment_name }}
      --kubeconfig {{ hub_kubeconfig }}
      --

# --------------------------------------------------------------------------
# Base OUs
# --------------------------------------------------------------------------
- name: Create ou=people OU
  ansible.builtin.shell:
    cmd: >
      {{ bin_dir | default('~/.local/bin') }}/oc exec -i
      -n {{ ds389.namespace }}
      deployment/{{ ds389.deployment_name }}
      --kubeconfig {{ hub_kubeconfig }}
      -- ldapadd -x
      -H ldap://localhost:{{ ds389.container_port }}
      -D '{{ ds389.root_dn }}'
      -w '{{ ds389.root_password }}'
    stdin: |
      dn: ou=people,{{ ds389.suffix }}
      objectClass: organizationalUnit
      ou: people
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  no_log: true

- name: Create ou=groups OU
  ansible.builtin.shell:
    cmd: >
      {{ bin_dir | default('~/.local/bin') }}/oc exec -i
      -n {{ ds389.namespace }}
      deployment/{{ ds389.deployment_name }}
      --kubeconfig {{ hub_kubeconfig }}
      -- ldapadd -x
      -H ldap://localhost:{{ ds389.container_port }}
      -D '{{ ds389.root_dn }}'
      -w '{{ ds389.root_password }}'
    stdin: |
      dn: ou=groups,{{ ds389.suffix }}
      objectClass: organizationalUnit
      ou: groups
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  no_log: true

# --------------------------------------------------------------------------
# LDAP service account
# --------------------------------------------------------------------------
- name: Create LDAP service account
  ansible.builtin.shell:
    cmd: >
      {{ bin_dir | default('~/.local/bin') }}/oc exec -i
      -n {{ ds389.namespace }}
      deployment/{{ ds389.deployment_name }}
      --kubeconfig {{ hub_kubeconfig }}
      -- ldapadd -x
      -H ldap://localhost:{{ ds389.container_port }}
      -D '{{ ds389.root_dn }}'
      -w '{{ ds389.root_password }}'
    stdin: |
      dn: uid={{ ds389_ldap_service_account.username }},ou=people,{{ ds389.suffix }}
      objectClass: inetOrgPerson
      objectClass: organizationalPerson
      objectClass: person
      objectClass: top
      uid: {{ ds389_ldap_service_account.username }}
      cn: {{ ds389_ldap_service_account.cn }}
      sn: {{ ds389_ldap_service_account.sn }}
      userPassword: {{ ds389_ldap_service_account.password }}
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  no_log: true

# --------------------------------------------------------------------------
# OCP test users
# --------------------------------------------------------------------------
- name: Create OCP test users
  ansible.builtin.shell:
    cmd: >
      {{ bin_dir | default('~/.local/bin') }}/oc exec -i
      -n {{ ds389.namespace }}
      deployment/{{ ds389.deployment_name }}
      --kubeconfig {{ hub_kubeconfig }}
      -- ldapadd -x
      -H ldap://localhost:{{ ds389.container_port }}
      -D '{{ ds389.root_dn }}'
      -w '{{ ds389.root_password }}'
    stdin: |
      dn: uid={{ item.username }},ou=people,{{ ds389.suffix }}
      objectClass: inetOrgPerson
      objectClass: organizationalPerson
      objectClass: person
      objectClass: top
      uid: {{ item.username }}
      cn: {{ item.cn }}
      sn: {{ item.sn }}
      mail: {{ item.username }}@example.com
      userPassword: {{ item.password }}
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  loop: "{{ ds389_ocp_users }}"
  no_log: true

# --------------------------------------------------------------------------
# OCP groups (groupOfNames requires at least one member)
# --------------------------------------------------------------------------
- name: Create OCP groups with members
  ansible.builtin.shell:
    cmd: >
      {{ bin_dir | default('~/.local/bin') }}/oc exec -i
      -n {{ ds389.namespace }}
      deployment/{{ ds389.deployment_name }}
      --kubeconfig {{ hub_kubeconfig }}
      -- ldapadd -x
      -H ldap://localhost:{{ ds389.container_port }}
      -D '{{ ds389.root_dn }}'
      -w '{{ ds389.root_password }}'
    stdin: |
      dn: cn={{ item }},ou=groups,{{ ds389.suffix }}
      objectClass: groupOfNames
      objectClass: top
      cn: {{ item }}
      {% for user in ds389_ocp_users if item in (user.groups | default([])) %}
      member: uid={{ user.username }},ou=people,{{ ds389.suffix }}
      {% endfor %}
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  loop: "{{ ds389_ocp_groups }}"
  no_log: true

# --------------------------------------------------------------------------
# OCP inventory snippets
# --------------------------------------------------------------------------
- name: Print OCP inventory update
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - "389 DS test data created. Use these values in disconnected-aws-inventory:"
      - "======================================================================"
      - ""
      - "LDAP URL (cluster-internal, no DNS/network issues):"
      - "  ldap:"
      - "    url: \"ldap://{{ ds389.service_name }}.{{ ds389.namespace }}.svc.cluster.local:389/ou=people,{{ ds389.suffix }}?uid\""
      - "    bind_dn: \"uid={{ ds389_ldap_service_account.username }},ou=people,{{ ds389.suffix }}\""
      - "    bind_password: \"{{ ds389_ldap_service_account.password }}\""
      - "    insecure: true"
      - "    ca_cert: \"\""
      - ""
      - "  groupsync:"
      - "    ldap_url: \"ldap://{{ ds389.service_name }}.{{ ds389.namespace }}.svc.cluster.local:389\""
      - "    bind_dn: \"uid={{ ds389_ldap_service_account.username }},ou=people,{{ ds389.suffix }}\""
      - "    bind_password: \"{{ ds389_ldap_service_account.password }}\""
      - "    groups_base_dn: \"ou=groups,{{ ds389.suffix }}\""
      - "    groups_filter: \"(&(objectClass=groupOfNames)(cn=openshift-*))\""
      - "    users_base_dn: \"ou=people,{{ ds389.suffix }}\""
      - ""
      - "Test users (password: {{ ds389_ocp_users[0].password }}):"
      - "{% for u in ds389_ocp_users %}  {{ u.username }} → {{ u.groups | join(', ') }}{% endfor %}"
      - "Bind account: {{ ds389_ldap_service_account.username }} / {{ ds389_ldap_service_account.password }}"
      - "======================================================================"
