---
- name: Install openldap-clients (provides ldapadd/ldapmodify)
  ansible.builtin.dnf:
    name: openldap-clients
    state: present

# Helper variable used throughout
- name: Set LDAP connection facts
  ansible.builtin.set_fact:
    _ldap_url: "ldap://localhost:{{ ds389_ldap_port }}"
    _bind_dn: "{{ ds389.root_dn }}"
    _bind_pw: "{{ ds389.root_password }}"
    _suffix: "{{ ds389.suffix }}"

# --------------------------------------------------------------------------
# Wait for 389 DS to finish auto-initializing the suffix backend.
# The LDAP port opens before the suffix entry is created, so ldapadd
# operations must be deferred until the base entry is queryable.
# Anonymous search on the base suffix is safe — no credentials in output.
# --------------------------------------------------------------------------
- name: Wait for 389 DS to be ready (check root DSE)
  ansible.builtin.shell: >
    ldapsearch -x
    -H {{ _ldap_url }}
    -b ''
    -s base namingContexts 2>&1
  register: _ds_ready
  until: _ds_ready.rc == 0
  retries: 24
  delay: 10
  changed_when: false

# --------------------------------------------------------------------------
# Organisational Units
# rc=68 = LDAP_ALREADY_EXISTS — treat as success (idempotent)
# --------------------------------------------------------------------------
- name: Create ou=people OU
  ansible.builtin.shell:
    cmd: "ldapadd -x -H {{ _ldap_url }} -D '{{ _bind_dn }}' -w '{{ _bind_pw }}'"
    stdin: |
      dn: ou=people,{{ _suffix }}
      objectClass: organizationalUnit
      ou: people
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  no_log: true

- name: Create ou=groups OU
  ansible.builtin.shell:
    cmd: "ldapadd -x -H {{ _ldap_url }} -D '{{ _bind_dn }}' -w '{{ _bind_pw }}'"
    stdin: |
      dn: ou=groups,{{ _suffix }}
      objectClass: organizationalUnit
      ou: groups
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  no_log: true

# --------------------------------------------------------------------------
# LDAP service account (OCP bind user)
# --------------------------------------------------------------------------
- name: Create LDAP service account
  ansible.builtin.shell:
    cmd: "ldapadd -x -H {{ _ldap_url }} -D '{{ _bind_dn }}' -w '{{ _bind_pw }}'"
    stdin: |
      dn: uid={{ ds389_ldap_service_account.username }},ou=people,{{ _suffix }}
      objectClass: inetOrgPerson
      objectClass: organizationalPerson
      objectClass: person
      objectClass: top
      uid: {{ ds389_ldap_service_account.username }}
      cn: {{ ds389_ldap_service_account.cn }}
      sn: {{ ds389_ldap_service_account.sn }}
      userPassword: {{ ds389_ldap_service_account.password }}
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  no_log: true

# --------------------------------------------------------------------------
# OCP test users
# --------------------------------------------------------------------------
- name: Create OCP test users
  ansible.builtin.shell:
    cmd: "ldapadd -x -H {{ _ldap_url }} -D '{{ _bind_dn }}' -w '{{ _bind_pw }}'"
    stdin: |
      dn: uid={{ item.username }},ou=people,{{ _suffix }}
      objectClass: inetOrgPerson
      objectClass: organizationalPerson
      objectClass: person
      objectClass: top
      uid: {{ item.username }}
      cn: {{ item.cn }}
      sn: {{ item.sn }}
      mail: {{ item.username }}@example.com
      userPassword: {{ item.password }}
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  loop: "{{ ds389_ocp_users }}"
  no_log: true

# --------------------------------------------------------------------------
# OCP groups with members.
# groupOfNames requires at least one member — users must exist first.
# rc=68 = already exists (idempotent).
# --------------------------------------------------------------------------
- name: Create OCP groups with members
  ansible.builtin.shell:
    cmd: "ldapadd -x -H {{ _ldap_url }} -D '{{ _bind_dn }}' -w '{{ _bind_pw }}'"
    stdin: |
      dn: cn={{ item }},ou=groups,{{ _suffix }}
      objectClass: groupOfNames
      objectClass: top
      cn: {{ item }}
      {% for user in ds389_ocp_users if item in (user.groups | default([])) %}
      member: uid={{ user.username }},ou=people,{{ _suffix }}
      {% endfor %}
  register: _result
  changed_when: _result.rc == 0
  failed_when: _result.rc not in [0, 68]
  loop: "{{ ds389_ocp_groups }}"
  no_log: true

# --------------------------------------------------------------------------
# Print only what needs to be updated in the OCP inventory.
# The ldap/rbac_bindings/groupsync blocks are pre-populated with Jinja2
# templates driven by base_domain. The only value that changes per
# environment and must be filled in manually is jumphost_private_ip.
# --------------------------------------------------------------------------
- name: Print OCP inventory update
  ansible.builtin.debug:
    msg:
      - "======================================================================"
      - "389 DS ready. One value to add/update in disconnected-aws-inventory:"
      - "======================================================================"
      - ""
      - "  jumphost_private_ip: \"{{ ansible_default_ipv4.address }}\""
      - ""
      - "The ldap, rbac_bindings, and groupsync blocks are already in the"
      - "inventory and derive their values from base_domain and jumphost_private_ip."
      - ""
      - "Resolved URLs for this environment:"
      - "  LDAP:   ldap://{{ ansible_default_ipv4.address }}:{{ ds389_ldap_port }}/ou=people,{{ _suffix }}?uid"
      - "  Groups: ldap://{{ ansible_default_ipv4.address }}:{{ ds389_ldap_port }}"
      - "  Suffix: {{ _suffix }}"
      - ""
      - "Test users (all passwords: {{ ds389_ocp_users[0].password }}):"
      - "{% for u in ds389_ocp_users %}  {{ u.username }}  → {{ u.groups | join(', ') }}{% endfor %}"
      - "Bind account: {{ ds389_ldap_service_account.username }} / {{ ds389_ldap_service_account.password }}"
      - "======================================================================"
