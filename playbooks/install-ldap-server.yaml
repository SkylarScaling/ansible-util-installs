---
# ==============================================================================
# Install 389 Directory Server and create OCP test users and groups.
# Replaces the earlier FreeIPA playbook — same purpose, no CA/Kerberos/Java.
#
# Run from the playbooks/ directory:
#   ansible-playbook install-ldap-server.yaml -i inventory-ldap.yaml
#
# To skip test data creation:
#   ansible-playbook install-ldap-server.yaml -i inventory-ldap.yaml --skip-tags testdata
# ==============================================================================
- name: Install 389 Directory Server
  hosts: ldap_server
  gather_facts: true
  become: true
  tags: ['389ds']
  tasks:
    - name: Install 389 DS
      ansible.builtin.include_role:
        name: 389ds/install_389ds_server

- name: Configure OCP Test Users and Groups
  hosts: ldap_server
  gather_facts: true
  become: true
  tags: ['testdata']
  tasks:
    - name: Create OCP test data in 389 DS
      ansible.builtin.include_role:
        name: 389ds/configure_389ds_ocp_testdata
      when: >
        (ds389_ocp_groups | default([]) | length > 0) or
        (ds389_ocp_users | default([]) | length > 0) or
        (ds389_ldap_service_account is defined)

# ==============================================================================
# SUMMARY: Restate SSH and next-step info
# ==============================================================================
- name: Post-install Summary
  hosts: ldap_server
  gather_facts: true
  become: false
  tags: ['always']
  tasks:
    - name: Print SSH connection and next steps
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "LDAP Setup Complete"
          - "=================================================================="
          - ""
          - "Jumphost SSH:"
          - "  ssh -i {{ ansible_ssh_private_key_file }} {{ ansible_user }}@{{ ansible_host }}"
          - ""
          - "Update disconnected-aws-inventory with:"
          - "  jumphost_private_ip: \"{{ ansible_default_ipv4.address }}\""
          - ""
          - "Copy inventory to jumphost:"
          - "  scp -i {{ ansible_ssh_private_key_file }} ~/inventories/disconnected-aws-inventory {{ ansible_user }}@{{ ansible_host }}:~/71638776-openshift-automation/playbooks/"
          - ""
          - "Then on the jumphost:"
          - "  cd ~/71638776-openshift-automation/playbooks"
          - "  ansible-playbook hub-spoke-disconnected-setup.yaml -i disconnected-aws-inventory"
          - "=================================================================="
