---
# ==============================================================================
# Install 389 Directory Server inside the OCP hub cluster and create OCP test
# users and groups. In disconnected environments, pod egress to the internet is
# blocked, so LDAP must run inside the cluster as a Deployment + ClusterIP
# Service. The image is mirrored from the jumphost (which has internet access)
# to the cluster's Quay registry.
#
# Run from the playbooks/ directory (jumphost has both internet and kubeconfig):
#   ansible-playbook install-ldap-server.yaml \
#     -i ~/inventories/ldap-inventory.yaml \
#     -i ~/inventories/disconnected-aws-inventory
#
# --skip-tags testdata   Install server only
# --tags testdata        Create/refresh test data only (server already running)
# ==============================================================================
- name: Deploy 389 DS to OCP and mirror image to cluster Quay
  hosts: ldap_server
  gather_facts: true
  become: true
  tags: ['389ds']
  tasks:
    - name: Deploy 389 DS to OCP cluster
      ansible.builtin.include_role:
        name: 389ds/install_389ds_server

- name: Configure OCP Test Users and Groups
  hosts: ldap_server
  gather_facts: true
  become: true
  tags: ['testdata']
  tasks:
    - name: Create OCP test data in 389 DS
      ansible.builtin.include_role:
        name: 389ds/configure_389ds_ocp_testdata
      when: >
        (ds389_ocp_groups | default([]) | length > 0) or
        (ds389_ocp_users | default([]) | length > 0) or
        (ds389_ldap_service_account is defined)

# ==============================================================================
# SUMMARY
# ==============================================================================
- name: Post-install Summary
  hosts: ldap_server
  gather_facts: true
  become: false
  tags: ['always']
  tasks:
    - name: Get ds389 LoadBalancer DNS
      ansible.builtin.shell: >
        {{ bin_dir | default('~/.local/bin') }}/oc get service {{ ds389.deployment_name | default('ds389') }}
        -n {{ ds389.namespace | default('openshift-config') }}
        --kubeconfig {{ hub_kubeconfig }}
        -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true
      register: _summary_lb_dns
      changed_when: false
      failed_when: false

    - name: Print next steps
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "LDAP Setup Complete"
          - "=================================================================="
          - ""
          - "389 DS LoadBalancer DNS:"
          - "  {{ _summary_lb_dns.stdout | trim | default('(pending — check: oc get svc ds389 -n openshift-config)') }}"
          - ""
          - "1. Update disconnected-aws-inventory — set ldap.url and groupsync.ldap_url to:"
          - "     ldap://{{ _summary_lb_dns.stdout | trim | default('<nlb-dns>') }}:389"
          - ""
          - "2. Copy inventory to jumphost:"
          - "     scp -i {{ ansible_ssh_private_key_file }} ~/inventories/disconnected-aws-inventory {{ ansible_user }}@{{ ansible_host }}:~/71638776-openshift-automation/playbooks/"
          - ""
          - "3. SSH to jumphost:"
          - "     ssh -i {{ ansible_ssh_private_key_file }} {{ ansible_user }}@{{ ansible_host }}"
          - ""
          - "4. Run the disconnected build:"
          - "     cd ~/71638776-openshift-automation/playbooks"
          - "     ansible-playbook hub-spoke-disconnected-setup.yaml -i disconnected-aws-inventory"
          - "=================================================================="
