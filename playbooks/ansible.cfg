[defaults]
roles_path = ../roles:../roles/389ds
host_key_checking = False
callbacks_enabled = ansible.posix.profile_tasks
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=30
